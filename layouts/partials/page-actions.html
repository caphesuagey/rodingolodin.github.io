{{- $icons := resources.Get "svg/feather-sprite.svg" | fingerprint -}}
<div class="page-actions">
  <div class="page-actions-controls">
    <button type="button" class="page-action-primary" id="page-actions-button">
      <svg class="button-icon" aria-hidden="true"><use href="{{ $icons.RelPermalink }}#copy" /></svg>
      <span class="button-text">Copy for LLM</span>
    </button>
    <button type="button" class="dropdown-toggle" id="page-actions-toggle"
      aria-label="Page actions" title="Page actions" aria-expanded="false"
      aria-haspopup="menu" aria-controls="page-actions-menu">
      <svg class="chevron-icon" aria-hidden="true"><use href="{{ $icons.RelPermalink }}#chevron-down" /></svg>
    </button>
  </div>
  <div class="dropdown-menu" id="page-actions-menu" role="menu"
    aria-labelledby="page-actions-toggle" hidden>
    <button type="button" class="dropdown-item is-selected" role="menuitem" tabindex="-1" data-action="copy-page">
      <svg class="item-icon" aria-hidden="true"><use href="{{ $icons.RelPermalink }}#copy" /></svg>
      <span>Copy for LLM<span class="item-description">Copy page as Markdown for LLMs</span></span>
    </button>
    <button type="button" class="dropdown-item" role="menuitem" tabindex="-1" data-action="view-markdown">
      <svg class="item-icon" aria-hidden="true"><use href="{{ $icons.RelPermalink }}#file-text" /></svg>
      <span>View as Markdown<span class="item-description">View this page as plain text</span></span>
    </button>
  </div>
  <span class="visually-hidden" id="page-actions-status" role="status"></span>
</div>
<div id="raw-content" hidden>{{ .RawContent }}</div>
{{- $script := resources.Get "js/page-actions.js" | minify | fingerprint -}}
<script src="{{ $script.RelPermalink }}" defer></script>
